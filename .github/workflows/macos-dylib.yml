name: macOS universal dylib
# Produces the ICE-enabled (native client, STUN+TURN) libGameNetworkingSockets.dylib
# shipped in the C# NuGet package (runtimes/osx-*/native). Runs on the self-hosted
# M2 runner: builds arm64 natively and x86_64 via the cross triplet, fuses with lipo.
# vcpkg lives at ~/vcpkg-gns on the runner, pinned to the manifest baseline, so
# dependency builds are cached on disk between runs.
#
# One-time runner prerequisites: Xcode command line tools + `brew install cmake ninja`.
# Manual trigger only — never runs on push/PR (self-hosted safety).
on:
  workflow_dispatch:

jobs:
  build-universal-dylib:
    name: Build universal dylib (self-hosted M2)
    runs-on: [self-hosted, macOS, ARM64]
    steps:
    - uses: actions/checkout@v4

    - name: Add Homebrew to PATH
      # The runner service does not inherit the login-shell PATH.
      run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

    - name: Sync vcpkg to manifest baseline
      run: |
        BASELINE=$(sed -n 's/.*"builtin-baseline": "\(.*\)".*/\1/p' vcpkg.json)
        echo "baseline: ${BASELINE}"
        if [ ! -d "$HOME/vcpkg-gns" ]; then
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg-gns"
        fi
        cd "$HOME/vcpkg-gns"
        git fetch --quiet origin
        git checkout --quiet "${BASELINE}"
        [ -x ./vcpkg ] || ./bootstrap-vcpkg.sh -disableMetrics

    - name: Build arm64
      run: |
        cmake -B build-arm64 -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="$HOME/vcpkg-gns/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=arm64-osx \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DBUILD_SHARED_LIBS=ON \
          -DENABLE_ICE=ON \
          -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TOOLS=OFF
        cmake --build build-arm64

    - name: Build x86_64
      run: |
        cmake -B build-x64 -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="$HOME/vcpkg-gns/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=x64-osx \
          -DCMAKE_OSX_ARCHITECTURES=x86_64 \
          -DBUILD_SHARED_LIBS=ON \
          -DENABLE_ICE=ON \
          -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TOOLS=OFF
        cmake --build build-x64

    - name: Fuse universal binary
      run: |
        ARM64_DYLIB=$(find build-arm64 -name 'libGameNetworkingSockets.dylib' -type f | head -n1)
        X64_DYLIB=$(find build-x64 -name 'libGameNetworkingSockets.dylib' -type f | head -n1)
        echo "arm64: ${ARM64_DYLIB}"
        echo "x64:   ${X64_DYLIB}"
        lipo -create "${ARM64_DYLIB}" "${X64_DYLIB}" -output libGameNetworkingSockets.dylib
        lipo -info libGameNetworkingSockets.dylib
        # Self-contained check: only system frameworks/libs may appear here.
        otool -L libGameNetworkingSockets.dylib

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: libGameNetworkingSockets-osx-universal
        path: libGameNetworkingSockets.dylib
        if-no-files-found: error
