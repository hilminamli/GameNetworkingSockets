name: macOS universal dylib
# Produces the ICE-enabled libGameNetworkingSockets.dylib shipped in the C# NuGet
# package (runtimes/osx-*/native). Mirrors the local recipe in
# BUILDING_SELF_CONTAINED.md: static vcpkg deps (openssl/protobuf) fused into a
# shared library, ENABLE_ICE + USE_STEAMWEBRTC (webrtc-lite from submodules).
# Builds arm64 + x86_64 on one Apple Silicon runner and merges them with lipo.
on:
  workflow_dispatch:

jobs:
  build-universal-dylib:
    name: Build universal dylib
    runs-on: macos-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DOWNLOADS: ${{ github.workspace }}/vcpkg-downloads
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite
    steps:
    - uses: actions/checkout@v4

    - name: Fetch submodules (shallow)
      # webrtc.googlesource.com is huge; try depth-1 first, fall back to full.
      run: |
        git submodule init
        git submodule update --depth 1 --recursive || git submodule update --recursive

    - name: Ensure vcpkg cache directories exist
      run: |
        mkdir -p "${VCPKG_DOWNLOADS}"
        mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE}"

    - name: Install Vcpkg
      # BUILDING_SELF_CONTAINED.md rule: builtin-baseline must equal the vcpkg
      # checkout HEAD, so clone master and point the manifest at it.
      run: |
        git clone https://github.com/microsoft/vcpkg.git "${VCPKG_ROOT}"
        cd "${VCPKG_ROOT}"
        ./bootstrap-vcpkg.sh -disableMetrics
        HEAD=$(git rev-parse HEAD)
        echo "vcpkg HEAD: ${HEAD}"
        cd "${GITHUB_WORKSPACE}"
        sed -i '' "s/\"builtin-baseline\": \".*\"/\"builtin-baseline\": \"${HEAD}\"/" vcpkg.json
        grep baseline vcpkg.json

    - name: Restore vcpkg caches
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.VCPKG_DOWNLOADS }}
          ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-dylib-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-dylib-${{ runner.os }}-

    - name: Build arm64
      run: |
        cmake -B build-arm64 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=arm64-osx \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DBUILD_SHARED_LIB=ON \
          -DENABLE_ICE=ON \
          -DUSE_STEAMWEBRTC=ON \
          -DProtobuf_USE_STATIC_LIBS=ON \
          -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TOOLS=OFF
        cmake --build build-arm64 --config Release

    - name: Build x86_64
      run: |
        cmake -B build-x64 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=x64-osx \
          -DCMAKE_OSX_ARCHITECTURES=x86_64 \
          -DBUILD_SHARED_LIB=ON \
          -DENABLE_ICE=ON \
          -DUSE_STEAMWEBRTC=ON \
          -DProtobuf_USE_STATIC_LIBS=ON \
          -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TOOLS=OFF
        cmake --build build-x64 --config Release

    - name: Fuse universal binary
      run: |
        ARM64_DYLIB=$(find build-arm64 -name 'libGameNetworkingSockets.dylib' -type f | head -n1)
        X64_DYLIB=$(find build-x64 -name 'libGameNetworkingSockets.dylib' -type f | head -n1)
        echo "arm64: ${ARM64_DYLIB}"
        echo "x64:   ${X64_DYLIB}"
        lipo -create "${ARM64_DYLIB}" "${X64_DYLIB}" -output libGameNetworkingSockets.dylib
        lipo -info libGameNetworkingSockets.dylib
        # Self-contained check: only system frameworks/libs may appear here.
        otool -L libGameNetworkingSockets.dylib

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: libGameNetworkingSockets-osx-universal
        path: libGameNetworkingSockets.dylib
        if-no-files-found: error
